<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login — MEKYY BOT</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top, #1b1b2f, #09090f 50%, #050507);
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 35px 30px;
      background: rgba(18, 18, 27, .95);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: linear-gradient(135deg,#7c3aed,#4f46e5);
      font-size: 30px;
      font-weight: 800;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9292a3;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #c7c7d2;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #2b2b3a;
      border-radius: 12px;
      outline: none;
      background: #101019;
      color: white;
      font-size: 14px;
    }

    input:focus {
      border-color: #7c3aed;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg,#7c3aed,#4f46e5);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 11px;
      border-radius: 10px;
      background: rgba(239,68,68,.1);
      color: #f87171;
      text-align: center;
      font-size: 13px;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #9292a3;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">M</div>

    <h1>Admin Login</h1>

    <p class="subtitle">
      Sign in to access MEKYY BOT.
    </p>

    <form id="loginForm">

      <label for="username">Username</label>
      <input
        id="username"
        type="text"
        placeholder="Enter username"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        Login
      </button>

    </form>

    <div id="error" class="error">
      Invalid username or password.
    </div>

    <a href="/" class="back">
      ← Back to Dashboard
    </a>

  </div>

  <script>
    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const error = document.getElementById("error");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      error.style.display = "none";
      button.disabled = true;
      button.textContent = "Logging in...";

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      try {
        const response = await fetch("/api/admin/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "include",
          body: JSON.stringify({
            username,
            password
          })
        });

        const data = await response.json();

        if (data.success) {
          window.location.href = "/";
          return;
        }

        error.textContent =
          data.error || "Invalid username or password.";

        error.style.display = "block";

      } catch (err) {
        error.textContent =
          "Unable to connect to server.";

        error.style.display = "block";

      } finally {
        button.disabled = false;
        button.textContent = "Login";
      }
    });
  </script>

</body>
</html>
